  <!-- Google Fonts: Roboto Flex & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">

  <style>
    :root {
      /* M3 Expressive Palette (Monet Slate/Violet Dark Scheme) */
      --md-sys-color-background: #0f141a;
      --md-sys-color-surface: #171d25;
      --md-sys-color-surface-container: #1e252f;
      --md-sys-color-surface-container-high: #29313d;
      --md-sys-color-primary: #9ecaff;
      --md-sys-color-on-primary: #003258;
      --md-sys-color-primary-container: #1b4975;
      --md-sys-color-on-primary-container: #d1e4ff;
      --md-sys-color-secondary-container: #394859;
      --md-sys-color-on-secondary-container: #d5e3f8;
      --md-sys-color-tertiary-container: #523e5f;
      --md-sys-color-on-tertiary-container: #f4d9ff;
      --md-sys-color-outline-variant: rgba(255, 255, 255, 0.1);
      --md-sys-color-on-surface: #e1e2e8;
      --md-sys-color-on-surface-variant: #c3c7cf;

      /* M3 Expressive Shape Tokens (Squircle Bezier approximations) */
      --md-shape-corner-xs: 8px;
      --md-shape-corner-sm: 12px;
      --md-shape-corner-md: 18px;
      --md-shape-corner-lg: 24px;
      --md-shape-corner-xl: 32px;
      --md-shape-corner-full: 9999px;

      /* M3 Spring / Emphasized Transitions */
      --md-motion-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --md-motion-standard: cubic-bezier(0.2, 0, 0, 1);
      --md-motion-duration: 250ms;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--md-sys-color-background);
      color: var(--md-sys-color-on-surface);
      font-family: 'Roboto Flex', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating Om Nom Background Elements */
    .bg-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-canvas img {
      position: absolute;
      width: 58px;
      opacity: 0.18;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
      animation: floatAround 22s infinite ease-in-out alternate;
    }

    .bg-canvas img:nth-child(1) { top: 8%; left: 12%; animation-duration: 18s; transform: rotate(-8deg); }
    .bg-canvas img:nth-child(2) { top: 20%; right: 14%; animation-duration: 24s; transform: rotate(14deg); }
    .bg-canvas img:nth-child(3) { bottom: 15%; left: 10%; animation-duration: 20s; transform: rotate(6deg); }
    .bg-canvas img:nth-child(4) { bottom: 10%; right: 18%; animation-duration: 26s; transform: rotate(-16deg); }
    .bg-canvas img:nth-child(5) { top: 55%; left: 4%; animation-duration: 22s; }
    .bg-canvas img:nth-child(6) { top: 48%; right: 6%; animation-duration: 19s; }
    .bg-canvas img:nth-child(7) { top: 82%; left: 45%; animation-duration: 25s; }
    .bg-canvas img:nth-child(8) { top: 4%; right: 42%; animation-duration: 21s; }

    @keyframes floatAround {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-22px) rotate(8deg) scale(1.05); }
      100% { transform: translateY(18px) rotate(-8deg) scale(0.96); }
    }

    /* Layout Wrapper */
    .portal-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* M3 Banner / Notification Pill */
    .banner-pill {
      background: rgba(30, 37, 47, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-xl);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .banner-pill .material-symbols-outlined {
      color: var(--md-sys-color-primary);
      font-size: 20px;
    }

    .banner-text {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      letter-spacing: 0.2px;
    }

    /* M3 Surface Card */
    .card-container {
      background: rgba(23, 29, 37, 0.8);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-xl);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    /* Header & Title */
    .portal-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .avatar-wrapper {
      width: 72px;
      height: 72px;
      border-radius: var(--md-shape-corner-lg);
      background: var(--md-sys-color-primary-container);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid var(--md-sys-color-outline-variant);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
    }

    .avatar-wrapper img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    .portal-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--md-sys-color-on-surface);
      letter-spacing: -0.5px;
    }

    .section-label {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--md-sys-color-primary);
      margin-bottom: 8px;
    }

    /* Quick Channel Index Matrix */
    .channel-matrix {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .matrix-chip {
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-primary);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-sm);
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all var(--md-motion-duration) var(--md-motion-spring);
    }

    .matrix-chip:hover {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      transform: translateY(-3px) scale(1.08);
      box-shadow: 0 4px 12px rgba(158, 202, 255, 0.35);
    }

    .matrix-chip:active {
      transform: scale(0.94);
    }

    /* Featured Link Buttons (M3 Filled / Tonal Cards) */
    .featured-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .featured-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-radius: var(--md-shape-corner-md);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all var(--md-motion-duration) var(--md-motion-spring);
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .featured-btn-primary {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .featured-btn-secondary {
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
    }

    .featured-btn-tertiary {
      background: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }

    .featured-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      filter: brightness(1.12);
    }

    .featured-btn:active {
      transform: scale(0.98);
    }

    .featured-btn .icon-side {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Social Icons Row */
    .social-strip {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .social-icon-btn {
      width: 48px;
      height: 48px;
      border-radius: var(--md-shape-corner-md);
      background: var(--md-sys-color-surface-container);
      border: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface);
      text-decoration: none;
      transition: all var(--md-motion-duration) var(--md-motion-spring);
    }

    .social-icon-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .social-icon-btn:hover {
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-primary);
      transform: translateY(-4px) scale(1.1);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }

    .social-icon-btn:active {
      transform: scale(0.92);
    }

    /* Footer Meta */
    .author-badge {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      opacity: 0.7;
      letter-spacing: 0.4px;
    }
  </style>
</head>
