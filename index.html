<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>btzz's portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #010501;
      --text: #ffffff;
      --btn-bg: rgba(255, 255, 255, 0.04);
      --btn-border: rgba(255, 255, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      perspective: 1000px;
    }

    /* --- ФОНОВЫЕ АМ НЯМЫ (УВЕЛИЧЕНО КОЛИЧЕСТВО, БЕЗ СВЕЧЕНИЯ) --- */
    .bg-visuals {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .omnom {
      position: absolute;
      width: 45px;
      height: auto;
      opacity: 0.6;
      animation: fastDiagonalFly infinite linear;
    }

    @keyframes fastDiagonalFly {
      0% { 
        transform: translate(0, 0) rotate(0deg); 
      }
      100% { 
        transform: translate(120vw, -120vh) rotate(360deg); 
      }
    }

    /* Много точек спавна с разными таймингами */
    .om1 { bottom: -5%; left: -15%; animation-duration: 3.2s; animation-delay: 0s; }
    .om2 { bottom: 15%; left: -20%; animation-duration: 2.8s; animation-delay: 0.8s; width: 35px; }
    .om3 { bottom: 35%; left: -15%; animation-duration: 3.5s; animation-delay: 1.5s; }
    .om4 { bottom: 50%; left: -25%; animation-duration: 4.0s; animation-delay: 2.2s; width: 55px; }
    .om5 { bottom: 65%; left: -10%; animation-duration: 3.0s; animation-delay: 0.4s; }
    .om6 { bottom: 80%; left: -20%; animation-duration: 2.6s; animation-delay: 1.1s; width: 30px; }
    .om7 { bottom: 25%; left: -10%; animation-duration: 3.8s; animation-delay: 0.2s; width: 50px; }
    .om8 { bottom: 90%; left: -15%; animation-duration: 2.9s; animation-delay: 1.8s; }

    /* --- ОБОРОЧНЫЙ КОНТЕЙНЕР --- */
    .portal-container {
      position: relative;
      z-index: 10;
      width: 92%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    /* --- ОСНОВНАЯ КОМПОЗИЦИЯ С РАМКОЙ --- */
    .flow-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(1, 5, 1, 0.4);
      backdrop-filter: blur(8px);
    }

    /* ЗАГОЛОВОК СЛЕВА */
    .main-title {
      font-size: 1.95rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: lowercase;
      text-align: left;
      width: 100%;
    }

    /* --- ЦИФРЫ В СЕТКЕ --- */
    .numbers-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      width: 100%;
    }

    .num-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text);
      text-decoration: none;
      font-family: 'Anton', Impact, 'Arial Narrow', sans-serif;
      font-size: 2.25rem;
      line-height: 1;
      font-stretch: ultra-condensed;
      opacity: 0.9;
      padding: 2px 0;
    }

    /* --- ДИАГОНАЛЬ (ВОЗВРАЩЕН ИСХОДНЫЙ ШРИФТ) --- */
    .diag-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
      margin: 4px 0;
    }

    .diag-link {
      color: #ffffff;
      text-decoration: none;
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.01em;
      display: block;
      width: 100%;
      white-space: pre;
      line-height: 1.15;
    }

    .step-1 { text-align: left; }
    .step-2 { text-align: center; }
    .step-3 { text-align: right; }

    /* --- КНОПКИ В 2 РЯДА --- */
    .icons-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }

    .icon-btn {
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 0px;
    }

    .icon-btn svg {
      width: 50%;
      height: 50%;
      fill: #ffffff;
    }

    /* --- ПОЛУПРОЗРАЧНАЯ НАДПИСЬ ЗА РАМКОЙ --- */
    .author-tag {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      text-align: right;
      margin-top: 6px;
      letter-spacing: 0.05em;
    }

    /* --- АНИМАЦИЯ ПРИ ВХОДЕ ДЛЯ ЭЛЕМЕНТОВ --- */
    .num-btn, .diag-link, .icon-btn, .main-title, .author-tag {
      opacity: 0;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .main-title { animation-delay: 0.1s; }
    .numbers-grid .num-btn:nth-child(1) { animation-delay: 0.15s; }
    .numbers-grid .num-btn:nth-child(2) { animation-delay: 0.2s; }
    .numbers-grid .num-btn:nth-child(3) { animation-delay: 0.25s; }
    .numbers-grid .num-btn:nth-child(4) { animation-delay: 0.3s; }
    .numbers-grid .num-btn:nth-child(5) { animation-delay: 0.35s; }
    .numbers-grid .num-btn:nth-child(6) { animation-delay: 0.4s; }
    .numbers-grid .num-btn:nth-child(7) { animation-delay: 0.45s; }

    .diag-container .step-1 { animation-delay: 0.5s; }
    .diag-container .step-2 { animation-delay: 0.55s; }
    .diag-container .step-3 { animation-delay: 0.6s; }

    .icons-grid .icon-btn:nth-child(1) { animation-delay: 0.65s; }
    .icons-grid .icon-btn:nth-child(2) { animation-delay: 0.7s; }
    .icons-grid .icon-btn:nth-child(3) { animation-delay: 0.75s; }
    .icons-grid .icon-btn:nth-child(4) { animation-delay: 0.8s; }
    .icons-grid .icon-btn:nth-child(5) { animation-delay: 0.85s; }
    .icons-grid .icon-btn:nth-child(6) { animation-delay: 0.9s; }
    .author-tag { animation-delay: 0.95s; }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* --- КНОПКА ВОПРОСА В ЛЕВОМ НИЖНЕМ УГЛУ --- */
    .info-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 38px;
      height: 38px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100;
      backdrop-filter: blur(8px);
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
      opacity: 0;
    }

    /* --- ПРУЖИНИСТОЕ МОДАЛЬНОЕ ОКНО --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: rgba(10, 15, 10, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 24px 36px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 0.05em;
      transform: scale(0.3);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-box {
      transform: scale(1);
    }
  </style>
</head>

  <script>
    const flow = document.getElementById('flow');
    const openModalBtn = document.getElementById('openModal');
    const modalOverlay = document.getElementById('modalOverlay');

    // Поворот по наклону устройства
    window.addEventListener('deviceorientation', (e) => {
      if (e.beta !== null && e.gamma !== null) {
        const tiltX = Math.max(-15, Math.min(15, (e.beta - 45) / 2)); 
        const tiltY = Math.max(-15, Math.min(15, e.gamma / 2));
        flow.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
      }
    });

    // Открытие и закрытие модалки
    openModalBtn.addEventListener('click', () => {
      modalOverlay.classList.add('active');
    });

    modalOverlay.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });
  </script>
